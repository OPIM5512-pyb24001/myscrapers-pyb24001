name: Deploy materialize-llm (CF Gen2 + Cloud Scheduler)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Function (Gen2)
        run: |
          gcloud functions deploy materialize-llm \
            --gen2 \
            --region=${{ vars.REGION }} \
            --runtime=python312 \
            --source=cloud_function/materialize-llm \
            --entry-point=materialize_http \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars=GCS_BUCKET=${{ vars.BUCKET_NAME }},STRUCTURED_PREFIX=structured \
            --service-account=${{ vars.RUNTIME_SA }}

      - name: Get Function URL
        id: cfurl
        run: |
          URL=$(gcloud functions describe materialize-llm \
            --gen2 \
            --region=${{ vars.REGION }} \
            --format="value(serviceConfig.uri)")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Create/Update Cloud Scheduler job
        run: |
          JOB_NAME="materialize-llm-hourly"
          URL="${{ steps.cfurl.outputs.url }}"

          if gcloud scheduler jobs describe "$JOB_NAME" --location=${{ vars.REGION }} >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location=${{ vars.REGION }} \
              --schedule="0 * * * *" \
              --uri="$URL" \
              --http-method=POST \
              --oidc-service-account-email=${{ vars.RUNTIME_SA }}
          else
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location=${{ vars.REGION }} \
              --schedule="0 * * * *" \
              --uri="$URL" \
              --http-method=POST \
              --oidc-service-account-email=${{ vars.RUNTIME_SA }}
          fi
