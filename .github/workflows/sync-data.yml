name: Data Sync Hourly Predictions to Repo
run-name: Syncing hourly predictions for ${{ github.ref_name }} by @${{ github.actor }}

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  BUCKET_NAME: ${{ vars.BUCKET_NAME }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
  GCS_PREDS_PREFIX: "structured/preds"
  OUTPUT_DIR: "results"

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: dw-dev

      - name: Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.PROJECT_ID }}

      - name: Find Latest Run ID
        id: latest_run
        shell: bash
        run: |
          set -euo pipefail

          LATEST_RUN_DIR=$(gsutil ls -d gs://${BUCKET_NAME}/${GCS_PREDS_PREFIX}/*/ | tail -1)
          LATEST_RUN_ID=$(echo "$LATEST_RUN_DIR" | sed -E "s|gs://${BUCKET_NAME}/${GCS_PREDS_PREFIX}/||; s|/||")

          echo "run_id=$LATEST_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Detected latest run ID: $LATEST_RUN_ID"

      - name: Download latest artifacts
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="${{ steps.latest_run.outputs.run_id }}"
          mkdir -p "${{ env.OUTPUT_DIR }}"

          # Download predictions
          gsutil cp \
            gs://${BUCKET_NAME}/${GCS_PREDS_PREFIX}/${RUN_ID}/preds.csv \
            ${OUTPUT_DIR}/${RUN_ID}-preds.csv

          # Download importance
          gsutil cp \
            gs://${BUCKET_NAME}/${GCS_PREDS_PREFIX}/${RUN_ID}/importance.csv \
            ${OUTPUT_DIR}/${RUN_ID}-importance.csv

          # Download PDP image
          gsutil cp \
            gs://${BUCKET_NAME}/${GCS_PREDS_PREFIX}/${RUN_ID}/pdp.png \
            ${OUTPUT_DIR}/${RUN_ID}-pdp.png

          echo "Downloaded all artifacts for run ${RUN_ID}"

      - name: Commit and Push New Files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          RUN_ID="${{ steps.latest_run.outputs.run_id }}"

          git add ${OUTPUT_DIR}/${RUN_ID}-preds.csv
          git add ${OUTPUT_DIR}/${RUN_ID}-importance.csv
          git add ${OUTPUT_DIR}/${RUN_ID}-pdp.png

          git commit -m "🤖 Data Sync: Add hourly artifacts for run ${RUN_ID}" || echo "No changes to commit"

          git pull --rebase origin dw-dev || true
          git push origin HEAD:dw-dev
